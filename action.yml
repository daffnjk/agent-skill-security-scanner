name: Agent Skill Security Scanner
description: Offline Skill scanning with mandatory completeness and report-integrity checks.
inputs:
  path:
    description: Workspace-relative Skill or collection directory.
    required: false
    default: skills
  mode:
    description: "Input mode: auto (SKILL.md aware), single, or collection."
    required: false
    default: auto
  output:
    description: Workspace-relative report directory, disjoint from the input.
    required: false
    default: .skillscan
  timeout:
    description: Whole-run deadline (Go duration, for example 5m).
    required: false
    default: 5m
  fail_on:
    description: "Risk policy: malicious, suspicious, or never. Incomplete scans always fail."
    required: false
    default: malicious
outputs:
  malicious:
    description: Number of malicious verdicts.
    value: ${{ steps.gate.outputs.malicious }}
  suspicious:
    description: Number of suspicious verdicts.
    value: ${{ steps.gate.outputs.suspicious }}
  benign:
    description: Number of benign verdicts.
    value: ${{ steps.gate.outputs.benign }}
  results:
    description: Workspace-relative path to results.jsonl.
    value: ${{ inputs.output }}/results.jsonl
runs:
  using: composite
  steps:
    - name: Set up supported Go toolchain
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.27.1'
        cache: false
    - name: Build trusted scanner source
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
        GOENV: 'off'
        GOFLAGS: ''
        GOWORK: 'off'
        GOTOOLCHAIN: local
      run: |
        set -euo pipefail
        cd "$ACTION_SOURCE"
        revision="$(git rev-parse HEAD)"
        GOCACHE="$RUNNER_TEMP/skillscan-go-cache" CGO_ENABLED=0 \
          go build -trimpath -ldflags="-s -w -buildid= -X main.buildCommit=$revision" \
          -o "$RUNNER_TEMP/skillscan" ./cmd/detector
    - name: Scan complete Skill directories
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        SKILLSCAN_ALLOW_PARTIAL: '0'
      run: |
        set -euo pipefail
        workspace="$(realpath -m "$GITHUB_WORKSPACE")"
        scan_path="$(realpath -m "$workspace/$INPUT_PATH")"
        output_path="$(realpath -m "$workspace/$INPUT_OUTPUT")"
        case "$scan_path/" in "$workspace/"*) ;; *) echo "scan path escapes the workspace" >&2; exit 2 ;; esac
        case "$output_path/" in "$workspace/"*) ;; *) echo "output path escapes the workspace" >&2; exit 2 ;; esac
        "$RUNNER_TEMP/skillscan" --mode "$INPUT_MODE" --timeout "$INPUT_TIMEOUT" "$scan_path" "$output_path"
    - name: Independently validate completeness and apply risk policy
      id: gate
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
      run: |
        set -euo pipefail
        python3 "$ACTION_SOURCE/scripts/github_action_gate.py" \
          --results "$GITHUB_WORKSPACE/$INPUT_OUTPUT/results.jsonl" \
          --scan-metadata "$GITHUB_WORKSPACE/$INPUT_OUTPUT/scan-metadata.jsonl" \
          --seal "$GITHUB_WORKSPACE/$INPUT_OUTPUT/scan-complete.json" \
          --fail-on "$INPUT_FAIL_ON"
