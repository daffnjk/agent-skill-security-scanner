name: Apply fail-closed hardening

on:
  push:
    branches: [codex/fail-closed-scan-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/fail-closed-scan-hardening
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Apply source and support patches
        run: |
          python3 scripts/patch_fail_closed.py
          python3 scripts/patch_fail_closed_support.py
          # Workflow files are updated separately through the GitHub connector.
          git checkout -- .github/workflows/ci.yml
          gofmt -w cmd/detector
      - name: Validate implementation
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
          bash scripts/selftest.sh
          git diff --check
      - name: Commit integrated implementation
        run: |
          rm scripts/patch_fail_closed.py scripts/patch_fail_closed_support.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(scanner): fail closed on incomplete scans"
          git push origin HEAD:codex/fail-closed-scan-hardening
