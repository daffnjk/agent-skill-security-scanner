name: Publish frozen generalization experiment
on:
  push:
    branches: [improve/generalization-evidence-20260906]
    paths: [.github/workflows/apply-generalization.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/improve/generalization-evidence-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify and apply preregistered experimental source (not an approval to merge)
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, subprocess
          from pathlib import Path
          root = Path('benchmarks/generalization')
          encoded = ''.join((root / f'delivery-part-{i}.b64').read_text().strip() for i in range(4))
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as stream:
              patch = stream.read(131073)
          if len(patch) > 131072 or hashlib.sha256(patch).hexdigest() != '1ebb586507d4b50f6e166f7f2d87e1cb1a40c2867b502dcf081ed643f1249def':
              raise ValueError('delivery patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          frozen = json.loads((root / 'FINAL_FREEZE.json').read_text())
          for name, expected in frozen['scanner_source_sha256'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise ValueError('scanner changed after freeze: ' + name)
          PY
          test -z "$(gofmt -l cmd/detector)"
          go vet ./...
          go test ./...
          go test -race ./...
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_*.py'
          ./scripts/selftest.sh
      - name: Commit source and delete temporary publication machinery
        run: |
          rm benchmarks/generalization/delivery-part-*.b64 .github/workflows/apply-generalization.yml
          git add cmd/detector scripts/evaluate_generalization.py scripts/prepare_generalization.py scripts/prepare_external_generalization.py scripts/test_generalization.py benchmarks/generalization/ablation-results.json benchmarks/generalization/requirements.txt benchmarks/generalization/delivery-part-*.b64 .github/workflows/apply-generalization.yml
          git -c user.name='skillscan validation' -c user.email='noreply@github.com' commit -m 'experiment: preserve lexical candidate and publish fail-closed generalization evaluation'
          git push origin HEAD:refs/heads/improve/generalization-evidence-20260906
