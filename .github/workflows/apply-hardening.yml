name: Apply and verify reviewed hardening
on:
  push:
    branches: [security/hardening-20260905]
    paths: ['.maintenance/**', '.github/workflows/apply-hardening.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/security/hardening-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/hardening-20260905
          fetch-depth: 1
      - name: Detect one-time migration
        id: pending
        run: |
          if [ -f .maintenance/bootstrap_hardening.py ]; then echo 'apply=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.pending.outputs.apply == 'true'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Apply base-checked changes and explicit rule IDs
        if: steps.pending.outputs.apply == 'true'
        run: |
          python3 .maintenance/bootstrap_hardening.py
          python3 .maintenance/apply_hardening.py
          go run .maintenance/migrate_findings.go
          gofmt -w cmd/detector/*.go
      - name: Pin actual builder image digest
        if: steps.pending.outputs.apply == 'true'
        run: |
          docker pull golang:1.27.1-alpine
          export BUILDER_DIGEST="$(docker image inspect golang:1.27.1-alpine --format '{{index .RepoDigests 0}}')"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          digest=os.environ['BUILDER_DIGEST'].split('@',1)[-1]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}',digest): raise SystemExit('invalid image digest')
          p=Path('Dockerfile'); p.write_text(p.read_text().replace('golang:1.27.1-alpine AS build','golang:1.27.1-alpine@'+digest+' AS build'))
          PY
      - name: Vet and full Go unit tests with coverage
        if: steps.pending.outputs.apply == 'true'
        run: |
          go vet ./...
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1
      - name: Race tests
        if: steps.pending.outputs.apply == 'true'
        run: go test -count=1 -race ./...
      - name: Historical regression self-test
        if: steps.pending.outputs.apply == 'true'
        run: bash scripts/selftest.sh
      - name: Python and real CLI/gate regression tests
        if: steps.pending.outputs.apply == 'true'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/skillscan" ./cmd/detector
          SKILLSCAN_BIN="$RUNNER_TEMP/skillscan" PYTHONPATH=scripts python3 -m unittest discover -v -s scripts -p 'test_*.py'
      - name: Container build
        if: steps.pending.outputs.apply == 'true'
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t skillscan:hardening .
      - name: Record validation and commit only verified source
        if: steps.pending.outputs.apply == 'true'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          paths=sorted(Path('cmd/detector').glob('*.go'))
          source_hash=hashlib.sha256(b''.join(str(p).encode()+b'\0'+p.read_bytes() for p in paths)).hexdigest()
          report={'base_commit':'d1c7672ace0666e7fca4b7380a9d38d0286bd829','workflow_run_id':os.environ['GITHUB_RUN_ID'],'go_version':subprocess.check_output(['go','version'],text=True).strip(),'tested_go_source_sha256':source_hash,'passed':['go vet ./...','go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...','go test -count=1 -race ./...','bash scripts/selftest.sh','Python discovery including real CLI/gate tests','docker build'],'public_benchmark_datasets_rerun':False}
          Path('docs/hardening-validation.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git rm .maintenance/bootstrap_hardening.py .maintenance/payload-*.bin .github/workflows/apply-hardening.yml
          rm -f .maintenance/apply_hardening.py .maintenance/migrate_findings.go
          git add cmd/detector scripts/*.py docs/*.md docs/*.json README.md README_EN.md CHANGELOG.md action.yml Dockerfile .github/workflows/ci.yml benchmarks/README.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: enforce complete scans, safe reports and auditable analysis'
          git push origin HEAD:security/hardening-20260905
