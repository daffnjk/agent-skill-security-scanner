name: Frozen generalization validation
on:
  workflow_dispatch:
  push:
    branches: [improve/generalization-evidence-20260906]
    paths: [.github/workflows/generalization.yml]
permissions:
  contents: read
jobs:
  frozen-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download fixed external corpus as inert data
        run: |
          python3 - <<'PY'
          import hashlib, json, tarfile, urllib.request
          from pathlib import Path
          root = Path('external-validation-input')
          root.mkdir()
          name = 'skilltrustbench-2026-08-30.tar.gz'
          expected = 'a1970087675a6991788c2624eb6101b72445a7c56b3e1720bd2b97f0add6622f'
          url = 'https://github.com/daffnjk/agent-skill-security-datasets/releases/download/skilltrustbench-2026-08-30/' + name
          digest = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(url, timeout=120) as response, (root / name).open('xb') as output:
              while chunk := response.read(1024 * 1024):
                  total += len(chunk)
                  if total > 512 * 1024 * 1024:
                      raise ValueError('download exceeds budget')
                  digest.update(chunk)
                  output.write(chunk)
          if digest.hexdigest() != expected:
              raise ValueError('checksum mismatch')
          with tarfile.open(root / name) as archive:
              inventory = [dict(name=m.name, size=m.size, regular=m.isfile()) for m in archive]
          (root / 'inventory.json').write_text(json.dumps(inventory, indent=2) + '\n')
          (root / 'provenance.json').write_text(json.dumps(dict(upstream_revision='f90517b7058fdcfea89af114c069fbf973f42bc7', archive_sha256=expected, bytes=total, license='CC-BY-NC-SA-4.0'), indent=2) + '\n')
          print(json.dumps(dict(bytes=total, members=len(inventory), verified=True)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: untouched-skilltrustbench-input
          path: external-validation-input/
          retention-days: 3
          if-no-files-found: error
